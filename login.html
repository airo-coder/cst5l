<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UM Library - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --um-red: #CC0000;
            --um-yellow: #FFD700;
        }

        .login-section {
            background: linear-gradient(135deg, var(--um-red), var(--um-yellow));
            min-height: 100vh;
            padding: 100px 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .btn-um {
            background-color: var(--um-yellow);
            color: var(--um-red);
            border: none;
            padding: 12px 30px;
            font-weight: bold;
            transition: transform 0.3s;
        }

        .btn-um:hover {
            transform: translateY(-2px);
        }

        .form-control:focus {
            border-color: var(--um-red);
            box-shadow: 0 0 0 0.25rem rgba(204, 0, 0, 0.25);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--um-red);">
        <div class="container">
            <a class="navbar-brand" href="#">UM Collaboration Room Reservation</a>
        </div>
    </nav>

    <section class="login-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="login-card p-4">
                        <h2 class="text-center mb-4" style="color: var(--um-red);">User Login</h2>
                        <form>
                            <div class="mb-3">
                                <label for="email" class="form-label">UM Email</label>
                                <input type="email" class="form-control" id="email" 
                                       placeholder="name@umindanao.edu.ph" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-um">Sign In</button>
                            </div>
                            <div class="text-center">
                                <a href="#forgot-password" class="text-decoration-none" 
                                   style="color: var(--um-red);">Forgot Password?</a>
                            </div>
                            <hr class="my-4">
                            <div class="text-center">
                                <p class="mb-0">Don't have an account? 
                                    <a href="#register" class="text-decoration-none" 
                                       style="color: var(--um-red);">Register here</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 University of Mindanao Library. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
